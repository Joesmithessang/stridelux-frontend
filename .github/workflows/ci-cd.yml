name: STRIDELUX CI/CD Pipeline

# =============================================================
# Triggers
# - Push to main: CI, security scans, SonarQube and deployment
# - Pull request to main: CI and security scans only
# - Manual: can be started from the GitHub Actions interface
# =============================================================
on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ===========================================================
  # Job 1: Trivy Security Scan
  # ===========================================================
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Creates a SARIF report containing Medium, High and
      # Critical findings.
      - name: Run Trivy SARIF scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          skip-dirs: node_modules,build,coverage,.scannerwork

      - name: Upload Trivy results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # This scan acts as a hard security gate.
      - name: Run Trivy Critical vulnerability gate
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,build,coverage,.scannerwork
          exit-code: "1"

  # ===========================================================
  # Job 2: Build, Test and Generate Coverage
  # ===========================================================
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Confirm coverage report exists
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "coverage/lcov.info was not generated."
            exit 1
          fi

          echo "Coverage report generated successfully."
          ls -lh coverage/lcov.info

      # SonarQube Community Build scans the main branch.
      # The coverage artifact is therefore needed only for
      # push/manual runs on main.
      - name: Upload coverage report
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      # Build using mock values so CI does not require the
      # application's AWS runtime configuration.
      - name: Build application
        run: npm run build
        env:
          CI: false
          REACT_APP_USE_MOCK: "true"

  # ===========================================================
  # Job 3: SonarQube Analysis and Quality Gate
  # ===========================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on:
      - self-hosted
      - Linux
      - X64

    needs:
      - ci

    # Community Build analysis runs on main, not pull requests.
    # This also allows a manual run when main is selected.
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    permissions:
      contents: read

    timeout-minutes: 20

    steps:
      - name: Checkout code with full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Confirm SonarQube is reachable
        run: |
          curl --fail --silent --show-error \
            "${SONAR_HOST_URL}/api/system/status"
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Run SonarQube analysis and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

      - name: Write SonarQube summary
        if: success()
        run: |
          echo "### SonarQube analysis passed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The SonarQube Quality Gate passed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quality Gate | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================
  # Job 4: Deploy Frontend to Production
  # ===========================================================
  deploy:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest

    needs:
      - ci
      - security-scan
      - sonarqube

    # This prevents your fork from deploying to the team's
    # production AWS environment.
    if: >
      github.repository == 'Joesmithessang/stridelux-frontend' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    environment:
      name: production
      url: https://${{ vars.CLOUDFRONT_DOMAIN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend for production
        run: npm run build
        env:
          CI: false
          REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ secrets.REACT_APP_COGNITO_CLIENT_ID }}
          REACT_APP_COGNITO_REGION: ${{ secrets.REACT_APP_COGNITO_REGION }}
          REACT_APP_API_GATEWAY_URL: ${{ secrets.REACT_APP_API_GATEWAY_URL }}
          REACT_APP_S3_MEDIA_URL: ${{ secrets.REACT_APP_S3_MEDIA_URL }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_USE_MOCK: "false"
          REACT_APP_USE_MOCK_AUTH: "false"

      # Temporary existing authentication method.
      # This must later be replaced with GitHub OIDC.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload versioned assets to S3
        run: |
          aws s3 sync build/ "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html to S3
        run: |
          aws s3 cp build/index.html \
            "s3://${{ secrets.S3_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Write frontend deployment summary
        run: |
          echo "### Frontend deployment successful ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://${{ vars.CLOUDFRONT_DOMAIN }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CloudFront cache | Invalidated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================
  # Job 5: Deploy Lambda Functions
  # ===========================================================
  deploy-lambdas:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest

    needs:
      - ci
      - security-scan
      - sonarqube

    # This prevents your fork from deploying Lambda functions.
    if: >
      github.repository == 'Joesmithessang/stridelux-frontend' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install script dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for Lambda code changes
        id: check_lambda
        run: node scripts/check-lambda-changes.js
        continue-on-error: true

      # Temporary existing authentication method.
      # This must later be replaced with GitHub OIDC.
      - name: Configure AWS credentials
        if: steps.check_lambda.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Lambda functions
        if: steps.check_lambda.outcome == 'success'
        run: node scripts/deploy-lambdas.js

      - name: Write Lambda deployment summary
        if: always()
        env:
          LAMBDA_OUTCOME: ${{ steps.check_lambda.outcome }}
        run: |
          if [ "$LAMBDA_OUTCOME" = "success" ]; then
            echo "### Lambda deployment successful ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Lambda deployment skipped ⏭️" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No Lambda code changes were detected." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
